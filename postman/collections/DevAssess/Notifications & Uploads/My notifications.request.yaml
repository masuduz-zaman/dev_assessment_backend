$kind: http-request
url: "{{baseUrl}}/notifications"
method: GET
scripts:
  - type: afterResponse
    code: const body = pm.response.json(); if (body.success && body.data.items[0] && body.data.items[0].id) { pm.collectionVariables.set('notificationId', body.data.items[0] && body.data.items[0].id); }
    language: text/javascript
order: 1000
