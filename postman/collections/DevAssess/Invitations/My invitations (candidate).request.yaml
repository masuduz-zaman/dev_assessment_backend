$kind: http-request
url: "{{baseUrl}}/invitations/mine"
method: GET
scripts:
  - type: afterResponse
    code: const body = pm.response.json(); if (body.success && body.data[0] && body.data[0].id) { pm.collectionVariables.set('invitationId', body.data[0] && body.data[0].id); }
    language: text/javascript
order: 3000
