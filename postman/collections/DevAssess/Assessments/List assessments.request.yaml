$kind: http-request
url: "{{baseUrl}}/assessments?scope=mine"
method: GET
queryParams:
  scope: mine
scripts:
  - type: afterResponse
    code: const body = pm.response.json(); if (body.success && body.data[0] && body.data[0].id) { pm.collectionVariables.set('assessmentId', body.data[0] && body.data[0].id); }
    language: text/javascript
order: 1000
